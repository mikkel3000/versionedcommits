name: Update release PR

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Tag release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: versionedcommits-release
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Detect merged release PR
        id: merged_release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          skip=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_pr_count="$(gh api "repos/${REPOSITORY}/commits/${PUSH_SHA}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "versionedcommits/release" and .head.repo.full_name == "'"${REPOSITORY}"'")] | length')"
            if [[ "$release_pr_count" != "0" ]]; then
              skip=true
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo files
        if: steps.merged_release.outputs.skip != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Select stable Rust
        if: steps.merged_release.outputs.skip != 'true'
        run: rustup default stable

      - name: Test
        if: steps.merged_release.outputs.skip != 'true'
        run: cargo test --locked

      - name: Build release binary
        if: steps.merged_release.outputs.skip != 'true'
        run: cargo build --locked --release

      - name: Detect release
        if: steps.merged_release.outputs.skip != 'true'
        id: release
        run: |
          release_tag="$(target/release/versionedcommits --next-tag)"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Remove stale release PR
        if: steps.merged_release.outputs.skip != 'true' && steps.release.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_pr="$(gh pr list --repo "$REPOSITORY" --base main --head versionedcommits/release --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$release_pr" ]]; then
            gh pr close "$release_pr" --repo "$REPOSITORY" --delete-branch
          elif git ls-remote --exit-code --heads origin refs/heads/versionedcommits/release >/dev/null 2>&1; then
            git push origin --delete versionedcommits/release
          fi

      - name: Generate release commit
        if: steps.merged_release.outputs.skip != 'true' && steps.release.outputs.tag != ''
        id: generated
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create versionedcommits/release origin/main
          install -Dm755 target/release/versionedcommits bin/versionedcommits
          bin/versionedcommits --format markdown --output CHANGELOG.md
          git add CHANGELOG.md bin/versionedcommits
          git commit -m "Update the changelog for version ${RELEASE_TAG}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        if: steps.merged_release.outputs.skip != 'true' && steps.release.outputs.tag != ''
        run: |
          remote_sha="$(git ls-remote --heads origin refs/heads/versionedcommits/release | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/versionedcommits/release:${remote_sha}" origin HEAD:refs/heads/versionedcommits/release
          else
            git push origin HEAD:refs/heads/versionedcommits/release
          fi

      - name: Create or update release PR
        if: steps.merged_release.outputs.skip != 'true' && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_pr="$(gh pr list --repo "$REPOSITORY" --base main --head versionedcommits/release --state open --json number --jq '.[0].number // empty')"
          pr_body="This automated PR contains the changelog and Linux binary for ${RELEASE_TAG}. Merging it releases and tags this version."
          if [[ -n "$release_pr" ]]; then
            gh pr edit "$release_pr" --repo "$REPOSITORY" --title "Release ${RELEASE_TAG}" --body "$pr_body"
          else
            gh pr create --repo "$REPOSITORY" --base main --head versionedcommits/release --title "Release ${RELEASE_TAG}" --body "$pr_body"
          fi

      - name: Mark release PR ready
        if: steps.merged_release.outputs.skip != 'true' && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_SHA: ${{ steps.generated.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh api --method POST "repos/${REPOSITORY}/statuses/${GENERATED_SHA}" -f state=success -f context=versionedcommits/release-pr -f description='Release contents generated and tested' -f target_url="$RUN_URL"
